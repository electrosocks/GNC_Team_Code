[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spacecraft-maneuver-planner"
version = "0.4.0"
description = "Reusable Hohmann, bielliptic, Lambert and CW capabilities with Level 0 validation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.11,<2"]

[project.optional-dependencies]
simulation = ["matplotlib>=3.7,<4"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["maneuver_planner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
